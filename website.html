<style>
/* ── Tokens ── */
:root{
  --sky-50:#F0F9FF;--sky-100:#E0F2FE;--sky-200:#BAE6FD;--sky-300:#7DD3FC;
  --sky-400:#38BDF8;--sky-500:#0EA5E9;--sky-600:#0284C7;--sky-700:#0369A1;
  --ink-900:#1B262C;--ink-800:#28353D;--ink-700:#3A4A54;--ink-600:#54646E;
  --ink-500:#71828C;--ink-400:#93A2AB;--ink-300:#BCC8CE;--ink-200:#DCE4E8;
  --ink-100:#EDF1F3;--ink-50:#F6F8F9;--white:#FFFFFF;
  --amber-400:#FBBF24;--amber-500:#F59E0B;--amber-600:#D97706;--amber-soft:#FEF3C7;
  --green-500:#16A34A;--green-soft:#DCFCE7;--red-500:#DC2626;--red-soft:#FEE2E2;
  --text-strong:var(--ink-900);--text-body:var(--ink-700);--text-muted:var(--ink-500);
  --text-subtle:var(--ink-400);--text-inverse:var(--white);--text-brand:var(--sky-600);
  --text-link:var(--sky-600);
  --surface-page:var(--white);--surface-card:var(--white);--surface-sunken:var(--ink-50);
  --surface-brand:var(--sky-500);--surface-brand-soft:var(--sky-50);
  --surface-ink:var(--ink-800);
  --border-subtle:var(--ink-200);--border-default:var(--ink-300);--border-strong:var(--ink-400);
  --ring-focus:0 0 0 3px rgba(14,165,233,0.35);
  --status-success:var(--green-500);--status-success-bg:var(--green-soft);
  --status-warning:var(--amber-600);--status-warning-bg:var(--amber-soft);
  --status-danger:var(--red-500);--status-danger-bg:var(--red-soft);
  --font-display:'Plus Jakarta Sans',system-ui,sans-serif;
  --font-sans:'Plus Jakarta Sans',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --weight-regular:400;--weight-medium:500;--weight-semibold:600;
  --weight-bold:700;--weight-extrabold:800;
  --text-xs:.75rem;--text-sm:.875rem;--text-base:1rem;--text-lg:1.125rem;
  --text-xl:1.25rem;--text-2xl:1.5rem;--text-3xl:1.875rem;--text-4xl:2.25rem;
  --text-5xl:3rem;--text-6xl:3.75rem;
  --leading-tight:1.1;--leading-snug:1.25;--leading-normal:1.5;--leading-relaxed:1.65;
  --tracking-tighter:-0.03em;--tracking-tight:-0.015em;--tracking-wider:0.12em;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;
  --space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;
  --space-16:64px;--space-20:80px;--space-24:96px;
  --radius-xs:4px;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;
  --radius-xl:20px;--radius-2xl:28px;--radius-full:9999px;
  --shadow-xs:0 1px 2px rgba(27,38,44,.06);
  --shadow-sm:0 1px 3px rgba(27,38,44,.08),0 1px 2px rgba(27,38,44,.05);
  --shadow-md:0 4px 12px rgba(27,38,44,.08);
  --shadow-lg:0 12px 28px rgba(27,38,44,.12);
  --shadow-xl:0 24px 48px rgba(27,38,44,.16);
  --shadow-brand:0 8px 20px rgba(14,165,233,.28);
  --ease-out:cubic-bezier(.22,.61,.36,1);
  --duration-fast:120ms;--duration-normal:200ms;
  --container-max:1200px;--container-narrow:760px;
}

/* ── Reset ── */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font-sans);font-size:var(--text-base);
  line-height:var(--leading-normal);font-weight:var(--weight-regular);
  color:var(--text-body);background:var(--surface-page);
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5,h6{margin:0;font-family:var(--font-display);color:var(--text-strong);
  line-height:var(--leading-tight);letter-spacing:var(--tracking-tight);
  font-weight:var(--weight-bold)}
p{margin:0}
a{color:var(--text-link);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--sky-200);color:var(--ink-900)}
:focus-visible{outline:none;box-shadow:var(--ring-focus);border-radius:var(--radius-sm)}
.eyebrow{font-size:var(--text-sm);font-weight:var(--weight-bold);
  letter-spacing:var(--tracking-wider);text-transform:uppercase;color:var(--text-brand)}
.numeric{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ── Button ── */
.btn{--_bg:var(--surface-brand);--_fg:var(--text-inverse);--_bd:transparent;--_sh:var(--shadow-brand);
  display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);
  font-family:var(--font-sans);font-weight:var(--weight-bold);letter-spacing:-.01em;
  border:1.5px solid var(--_bd);background:var(--_bg);color:var(--_fg);box-shadow:var(--_sh);
  border-radius:var(--radius-md);cursor:pointer;white-space:nowrap;text-decoration:none;
  transition:transform var(--duration-fast) var(--ease-out),
    background var(--duration-normal) var(--ease-out),filter var(--duration-normal) var(--ease-out)}
.btn:hover{filter:brightness(.96)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn:focus-visible{outline:none;box-shadow:var(--ring-focus)}
.btn--sm{font-size:var(--text-sm);padding:8px 14px;border-radius:var(--radius-sm)}
.btn--md{font-size:var(--text-base);padding:11px 20px}
.btn--lg{font-size:var(--text-lg);padding:15px 28px;border-radius:var(--radius-lg)}
.btn--secondary{--_bg:var(--white);--_fg:var(--text-strong);--_bd:var(--border-default);--_sh:var(--shadow-xs)}
.btn--secondary:hover{--_bg:var(--ink-50);filter:none}
.hero .btn--secondary{--_bg:rgba(255,255,255,.12);--_fg:#fff;--_bd:rgba(255,255,255,.45);--_sh:none}
.hero .btn--secondary:hover{--_bg:rgba(255,255,255,.22);filter:none}
.btn--ghost{--_bg:transparent;--_fg:var(--text-brand);--_bd:transparent;--_sh:none}
.btn--ghost:hover{--_bg:var(--surface-brand-soft);filter:none}
.btn--ink{--_bg:var(--surface-ink);--_fg:var(--text-inverse);--_bd:transparent;--_sh:var(--shadow-md)}
.btn--block{width:100%}

/* ── Badge ── */
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-sans);
  font-weight:var(--weight-bold);font-size:var(--text-xs);line-height:1;
  padding:5px 10px;border-radius:var(--radius-full);border:1px solid transparent;white-space:nowrap}
.badge--neutral{background:var(--ink-100);color:var(--ink-700)}
.badge--brand{background:var(--surface-brand-soft);color:var(--sky-700)}
.badge--success{background:var(--status-success-bg);color:#15803D}
.badge__dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* ── Card ── */
.card{background:var(--surface-card);border:1px solid var(--border-subtle);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;
  transition:box-shadow var(--duration-normal) var(--ease-out),transform var(--duration-normal) var(--ease-out)}
.card--brand{border-color:var(--sky-300);box-shadow:0 0 0 1px var(--sky-200),var(--shadow-md)}
.card__pad{padding:var(--space-6)}

/* ── Avatar ── */
.avatar{display:inline-flex;align-items:center;justify-content:center;flex:none;
  border-radius:var(--radius-full);font-family:var(--font-sans);font-weight:var(--weight-bold);
  color:var(--sky-700);background:var(--sky-100);overflow:hidden;user-select:none}
.avatar--ring{box-shadow:0 0 0 2px var(--white),0 0 0 4px var(--sky-400)}
.avatar--sm{width:32px;height:32px;font-size:var(--text-xs)}
.avatar--md{width:44px;height:44px;font-size:var(--text-base)}
.avatar--lg{width:64px;height:64px;font-size:var(--text-xl)}

/* ── Rating ── */
.rating{display:inline-flex;align-items:center;gap:8px}
.hero .rating__value{color:#fff}
.hero .rating__count{color:rgba(255,255,255,.75)}
.rating__stars{display:inline-flex;gap:2px;color:var(--amber-500)}
.rating__value{font-weight:var(--weight-bold);color:var(--text-strong);font-size:var(--text-sm)}
.rating__count{font-size:var(--text-sm);color:var(--text-muted)}
.star-empty{color:var(--ink-200)}

/* ── Input ── */
.field{display:flex;flex-direction:column;gap:6px;font-family:var(--font-sans)}
.field__label{font-size:var(--text-sm);font-weight:var(--weight-semibold);color:var(--text-strong)}
.input-wrap{position:relative;display:flex;align-items:center}
.input-icon{position:absolute;left:14px;display:flex;color:var(--text-subtle);pointer-events:none}
.input{width:100%;font-family:var(--font-sans);font-size:var(--text-base);color:var(--text-strong);
  background:var(--white);border:1.5px solid var(--border-default);border-radius:var(--radius-md);
  padding:11px 14px;transition:border-color var(--duration-normal) var(--ease-out),box-shadow var(--duration-normal) var(--ease-out)}
.input::placeholder{color:var(--text-subtle)}
.input:hover{border-color:var(--border-strong)}
.input:focus{outline:none;border-color:var(--sky-500);box-shadow:var(--ring-focus)}
.input--icon{padding-left:40px}

/* ── Select ── */
.select-wrap{position:relative;display:flex;flex-direction:column;gap:6px}
.select-inner{position:relative}
.select{appearance:none;width:100%;font-family:var(--font-sans);font-size:var(--text-base);
  color:var(--text-strong);background:var(--white);border:1.5px solid var(--border-default);
  border-radius:var(--radius-md);padding:11px 40px 11px 14px;cursor:pointer;
  transition:border-color var(--duration-normal) var(--ease-out),box-shadow var(--duration-normal) var(--ease-out)}
.select:hover{border-color:var(--border-strong)}
.select:focus{outline:none;border-color:var(--sky-500);box-shadow:var(--ring-focus)}
.select-chev{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text-muted)}

/* ── Checkbox ── */
.check{display:inline-flex;align-items:flex-start;gap:10px;font-family:var(--font-sans);cursor:pointer;user-select:none}
.check input{position:absolute;opacity:0;width:0;height:0}
.check__box{flex:none;width:22px;height:22px;border-radius:var(--radius-sm);
  border:1.5px solid var(--border-default);background:var(--white);
  display:grid;place-items:center;color:var(--white);margin-top:1px;
  transition:background var(--duration-fast) var(--ease-out),border-color var(--duration-fast) var(--ease-out)}
.check:hover .check__box{border-color:var(--sky-500)}
.check input:checked+.check__box{background:var(--sky-500);border-color:var(--sky-500)}
.check__box svg{opacity:0;transition:opacity var(--duration-fast) var(--ease-out)}
.check input:checked+.check__box svg{opacity:1}
.check__text{font-size:var(--text-base);color:var(--text-body);line-height:1.4}

/* ── Header ── */
.site-header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.85);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border-subtle)}
.site-header__inner{max-width:var(--container-max);margin:0 auto;
  padding:14px var(--space-6);display:flex;align-items:center;gap:var(--space-8)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer}
.logo__word{font-family:var(--font-display);font-weight:var(--weight-extrabold);
  font-size:var(--text-xl);letter-spacing:var(--tracking-tight);color:var(--ink-900);white-space:nowrap}
.logo__word span{color:var(--sky-500)}
.logo__word--light{color:#fff}
.site-nav{display:flex;gap:var(--space-6);margin-right:auto}
.site-nav a{color:var(--text-body);font-weight:var(--weight-medium);font-size:var(--text-sm);text-decoration:none}
.site-nav a:hover{color:var(--sky-600)}
.header-actions{display:flex;align-items:center;gap:var(--space-4)}
.phone-link{display:flex;align-items:center;gap:6px;font-weight:var(--weight-semibold);
  font-size:var(--text-sm);color:var(--ink-800);text-decoration:none}
.phone-link svg{color:var(--sky-500)}

.hero::before{content:'';position:absolute;inset:0;
  background:linear-gradient(110deg,rgba(10,18,22,.80) 0%,rgba(10,18,22,.65) 50%,rgba(10,18,22,.30) 100%)}
.hero__content{position:relative;z-index:1;width:100%;max-width:var(--container-max);
  margin:0 auto;padding:var(--space-20) var(--space-6) var(--space-16)}
.hero__copy{max-width:660px}
.hero__copy h1{font-size:var(--text-6xl);font-weight:var(--weight-extrabold);
  letter-spacing:var(--tracking-tighter);margin:var(--space-5) 0 var(--space-4);color:#fff}
.hero__copy h1 .accent{color:var(--sky-400)}
.lead{font-size:var(--text-xl);line-height:var(--leading-snug);color:rgba(255,255,255,.85);max-width:44ch}
.hero__cta{display:flex;gap:var(--space-3);margin:var(--space-8) 0 var(--space-6)}
.hero__trust{display:flex;align-items:center;gap:var(--space-4);flex-wrap:wrap}
.divider{width:1px;height:20px;background:rgba(255,255,255,.3)}
.trust-item{display:inline-flex;align-items:center;gap:6px;font-size:var(--text-sm);
  font-weight:var(--weight-semibold);color:rgba(255,255,255,.9)}
.trust-item svg{color:var(--sky-400)}
.muted{color:var(--text-muted)}

/* ── Strip ── */
.strip{background:var(--ink-800);color:var(--ink-100);display:flex;
  justify-content:center;gap:var(--space-10);flex-wrap:wrap;padding:var(--space-5) var(--space-6)}
.strip span{display:inline-flex;align-items:center;gap:8px;
  font-size:var(--text-sm);font-weight:var(--weight-semibold)}
.strip svg{color:var(--sky-400)}

/* ── Sections ── */
.section{max-width:var(--container-max);margin:0 auto;padding:var(--space-24) var(--space-6)}
.section--sunken{max-width:100%;background:var(--surface-sunken)}
.section--sunken>.section-inner{max-width:var(--container-max);margin:0 auto}
.section__head{text-align:center;max-width:60ch;margin:0 auto var(--space-12);
  display:flex;flex-direction:column;gap:var(--space-3);align-items:center}
.section__head h2{font-size:var(--text-4xl);font-weight:var(--weight-extrabold);
  letter-spacing:var(--tracking-tight)}
.section__head .muted{font-size:var(--text-lg)}

/* ── Packages ── */
.packages{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-6);align-items:start}
.pkg{position:relative}
.pkg__ribbon{position:absolute;top:var(--space-5);right:var(--space-5);z-index:1}
.pkg__subtitle{font-size:var(--text-xs);font-weight:var(--weight-bold);letter-spacing:.08em;
  text-transform:uppercase;color:var(--text-muted);margin-bottom:4px}
.pkg h3{font-size:var(--text-2xl)}
.pkg__tag{margin:6px 0 var(--space-4);font-size:var(--text-sm);line-height:var(--leading-relaxed)}
.pkg__price{display:flex;align-items:baseline;gap:8px;margin-bottom:var(--space-5)}
.pkg__price .numeric{font-size:var(--text-4xl);font-weight:var(--weight-bold);color:var(--ink-900)}
.pkg__quote{font-size:var(--text-2xl);font-weight:var(--weight-bold);color:var(--ink-500)}
.pkg__section{margin-bottom:var(--space-4)}
.pkg__section-label{font-size:var(--text-xs);font-weight:var(--weight-bold);letter-spacing:.08em;
  text-transform:uppercase;color:var(--sky-600);margin-bottom:var(--space-2)}
.pkg__section-label--off{color:var(--ink-300)}
.pkg__list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pkg__list li{display:flex;align-items:flex-start;gap:8px;font-size:var(--text-sm);color:var(--text-body)}
.pkg__list svg{color:var(--sky-500);flex:none;margin-top:1px}
.pkg__list--off li{color:var(--ink-300)}
.pkg__list--off svg{color:var(--ink-200)}
.pkg__note{text-align:center;font-size:var(--text-sm);color:var(--text-muted);
  margin-top:var(--space-6);padding:var(--space-4);background:var(--ink-50);
  border-radius:var(--radius-md)}
/* Vehicle tabs */
.vehicle-tabs{display:flex;gap:var(--space-3);flex-wrap:wrap;justify-content:center;
  margin-bottom:var(--space-8)}
.vehicle-tab{background:var(--white);border:1.5px solid var(--border-default);
  border-radius:var(--radius-lg);padding:var(--space-4) var(--space-5);cursor:pointer;
  font-family:var(--font-sans);text-align:left;min-width:180px;flex:1;max-width:220px;
  transition:all var(--duration-fast) var(--ease-out)}
.vehicle-tab:hover{border-color:var(--sky-300)}
.vehicle-tab.is-on{border-color:var(--sky-500);background:var(--sky-50);
  box-shadow:0 0 0 1px var(--sky-500)}
.vehicle-tab__label{display:block;font-weight:var(--weight-bold);font-size:var(--text-sm);
  color:var(--ink-900)}
.vehicle-tab.is-on .vehicle-tab__label{color:var(--sky-700)}
.vehicle-tab__sub{display:block;font-size:var(--text-xs);color:var(--text-muted);
  margin-top:2px;line-height:1.4}
/* Why Choose Us */

/* ── DS Components ── */
function Button({ variant='primary', size='md', block=false, leadingIcon=null, trailingIcon=null, children, className='', ...rest }) {
  const cls = ['btn', `btn--${size}`, variant !== 'primary' ? `btn--${variant}` : '', block ? 'btn--block' : '', className].filter(Boolean).join(' ');
  return <button className={cls} {...rest}>{leadingIcon}{children}{trailingIcon}</button>;
}

function Badge({ variant='neutral', dot=false, children, className='' }) {
  return (
    <span className={['badge', `badge--${variant}`, className].filter(Boolean).join(' ')}>
      {dot && <span className="badge__dot" aria-hidden="true"/>}
      {children}
    </span>
  );
}

function Card({ brand=false, padded=true, children, className='', ...rest }) {
  return (
    <div className={['card', brand ? 'card--brand' : '', className].filter(Boolean).join(' ')} {...rest}>
      {padded ? <div className="card__pad">{children}</div> : children}
    </div>
  );
}

function Avatar({ name='', size='md', ring=false }) {
  const initials = name.trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()||'').join('');
  return <span className={['avatar', `avatar--${size}`, ring ? 'avatar--ring' : ''].filter(Boolean).join(' ')}>{initials}</span>;
}

function Star({ size, filled }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={filled ? 'currentColor' : 'none'}
      stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
      className={filled ? '' : 'star-empty'}>
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
    </svg>
  );
}

function Rating({ value=5, max=5, size=18, count, showValue=false }) {
  return (
    <span className="rating">
      <span className="rating__stars">{Array.from({length:max},(_,i)=><Star key={i} size={size} filled={i<Math.round(value)}/>)}</span>
      {showValue && <span className="rating__value">{value.toFixed(1)}</span>}
      {count!=null && <span className="rating__count">({count.toLocaleString()})</span>}
    </span>
  );
}

function Input({ label, icon=null, id, className='', ...rest }) {
  const fid = id || `f-${Math.random().toString(36).slice(2,7)}`;
  return (
    <div className="field">
      {label && <label className="field__label" htmlFor={fid}>{label}</label>}
      <div className="input-wrap">
        {icon && <span className="input-icon">{icon}</span>}
        <input id={fid} className={['input', icon ? 'input--icon' : '', className].filter(Boolean).join(' ')} {...rest}/>
      </div>
    </div>
  );
}

function Select({ label, options=[], placeholder, id, ...rest }) {
  const fid = id || `s-${Math.random().toString(36).slice(2,7)}`;
  return (
    <div className="select-wrap">
      {label && <label className="field__label" htmlFor={fid}>{label}</label>}
      <div className="select-inner">
        <select id={fid} className="select" {...rest}>
          {placeholder && <option value="" disabled>{placeholder}</option>}
          {options.map(o=><option key={o} value={o}>{o}</option>)}
        </select>
        <span className="select-chev">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
      </div>
    </div>
  );
}

function Checkbox({ label, checked, onChange, disabled=false }) {
  return (
    <label className={['check', disabled ? 'check--disabled' : ''].filter(Boolean).join(' ')}>
      <input type="checkbox" checked={checked} onChange={onChange} disabled={disabled}/>
      <span className="check__box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </span>
      {label && <span className="check__text">{label}</span>}
    </label>
  );
}

/* ── BookingScreen ── */
function BookingScreen({ initialPackage, onConfirm, onHome }) {
  const [step,    setStep]    = useState(1);
  const [pkgId,   setPkgId]   = useState(initialPackage || 'full');
  const [vehicle, setVehicle] = useState('');
  const [address, setAddress] = useState('');
  const [day,     setDay]     = useState('Sat, Jun 13');
  const [time,    setTime]    = useState('10:00 AM');
  const [shampoo, setShampoo] = useState(false);
  const [petHair, setPetHair] = useState(false);

  const pkg    = PACKAGES.find(p => p.id === pkgId);
  const addons = (shampoo ? 40 : 0) + (petHair ? 25 : 0);
  const total  = pkg.price + addons;
  const labels = ['Package','Vehicle & place','Schedule'];

  return (
    <main className="booking">
      <div className="booking__top">
        <button className="back-btn" onClick={onHome}><ArrowLeft width={16} height={16}/> Back to home</button>
        <ol className="stepper">
          {labels.map((lbl,i) => {
            const n = i + 1;
            const st = n < step ? 'done' : n === step ? 'active' : 'todo';
            return (
              <li key={lbl} className={`stepper__item is-${st}`}>
                <span className="stepper__dot">{st === 'done' ? <Check width={14} height={14}/> : n}</span>
                {lbl}
              </li>
            );
          })}
        </ol>
      </div>

      <div className="booking__grid">
        <div className="booking__main">
          {step === 1 && (
            <section>
              <h2>Choose a package</h2>
              <div className="choices">
                {PACKAGES.map(p => (
                  <button key={p.id} className={`choice ${pkgId===p.id?'is-on':''}`} onClick={() => setPkgId(p.id)}>
                    <div className="choice__radio"/>
                    <div className="choice__body">
                      <div className="choice__head">
                        <strong>{p.name}</strong>
                        {p.popular && <Badge variant="brand">Popular</Badge>}
                      </div>
                      <span className="muted">{p.tagline}</span>
                    </div>
                    <div className="choice__price">
                      <span className="numeric">${p.prices.sedan}+</span>
                      <span className="muted">{p.duration}</span>
                    </div>
                  </button>
                ))}
              </div>
            </section>
          )}

          {step === 2 && (
            <section>
              <h2>Your vehicle &amp; where we'll meet</h2>
              <div className="form-grid">
                <Select label="Vehicle type" placeholder="Choose one" value={vehicle} onChange={e => setVehicle(e.target.value)} options={VEHICLES}/>
                <Input  label="Make & model" placeholder="e.g. Audi Q5" icon={<CarFront width={18} height={18}/>}/>
                <div style={{gridColumn:'1/-1'}}>
                  <Input label="Service address" placeholder="123 Maple Ave" icon={<MapPin width={18} height={18}/>} value={address} onChange={e => setAddress(e.target.value)}/>
                </div>
              </div>
              <div className="addons">
                <span className="eyebrow">Add-ons</span>
                <Checkbox label="Interior shampoo (+$40)"       checked={shampoo} onChange={e => setShampoo(e.target.checked)}/>
                <Checkbox label="Heavy pet-hair removal (+$25)" checked={petHair} onChange={e => setPetHair(e.target.checked)}/>
              </div>
            </section>
          )}

          {step === 3 && (
            <section>
              <h2>Pick a time</h2>
              <p className="muted" style={{marginBottom:'var(--space-4)'}}>Most areas have same-week availability. Your detailer texts when they're 15 minutes out.</p>
              <div className="days">
                {['Fri, Jun 12','Sat, Jun 13','Sun, Jun 14','Mon, Jun 15'].map(d => (
                  <button key={d} className={`pill ${day===d?'is-on':''}`} onClick={() => setDay(d)}>{d}</button>
                ))}
              </div>
              <div className="times">
                {TIMES.map(t => (
                  <button key={t} className={`pill ${time===t?'is-on':''}`} onClick={() => setTime(t)}><span className="numeric">{t}</span></button>
                ))}
              </div>
            </section>
          )}

          <div className="booking__nav">
            {step > 1 && <Button variant="ghost" onClick={() => setStep(step-1)} leadingIcon={<ArrowLeft width={16} height={16}/>}>Back</Button>}
            <div style={{flex:1}}/>
            {step < 3
              ? <Button onClick={() => setStep(step+1)} trailingIcon={<ArrowRight width={16} height={16}/>}>Continue</Button>
              : <Button onClick={() => onConfirm({pkg,day,time,total})} trailingIcon={<Check width={16} height={16}/>}>Confirm booking</Button>
            }
          </div>
        </div>

        <aside className="summary">
          <Card>
            <span className="eyebrow">Your booking</span>
            <h3 className="summary__pkg">{pkg.name}</h3>
            <div className="summary__line"><span className="muted">Vehicle</span><span>{vehicle||'—'}</span></div>
            <div className="summary__line"><span className="muted">When</span><span>{day} · {time}</span></div>
            <div className="summary__line"><span className="muted">Duration</span><span>{pkg.duration}</span></div>
            {shampoo && <div className="summary__line"><span className="muted">Interior shampoo</span><span className="numeric">$40</span></div>}
            {petHair && <div className="summary__line"><span className="muted">Pet-hair removal</span><span className="numeric">$25</span></div>}
            <div className="summary__total"><span>Total</span><span className="numeric">${total}</span></div>
            <p className="summary__note"><Lock width={14} height={14}/> Card saved securely. You're only charged after the job.</p>
          </Card>
        </aside>
      </div>
    </main>
  );
}

/* ── ConfirmScreen ── */
function ConfirmScreen({ booking, onHome }) {
  const b = booking || {};
  return (
    <main className="confirm">
      <div className="confirm__hero">
        <div className="confirm__check"><Check width={38} height={38}/></div>
        <h1>You're booked in.</h1>
        <p className="lead">We've emailed your confirmation. Your detailer will text you the morning of.</p>
      </div>
      <Card style={{boxShadow:'var(--shadow-lg)'}}>
        <div className="confirm__row">
          <div><span className="eyebrow">Service</span><strong>{b.pkg ? b.pkg.name : 'Full Detail'}</strong></div>
          <div><span className="eyebrow">When</span><strong>{b.day||'Sat, Jun 13'} · {b.time||'10:00 AM'}</strong></div>
          <div><span className="eyebrow">Total</span><strong className="numeric">${b.total!=null?b.total:189}</strong></div>
        </div>
        <div className="confirm__detailer">
          <Avatar name="Tay Lin" size="lg" ring/>
          <div className="confirm__detailer-info">
            <strong>Tay Lin · your detailer</strong>
            <span className="muted">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="var(--amber-500)" stroke="var(--amber-500)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="inline-star"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              {' '}4.95 · 480 details completed
            </span>
          </div>
          <Badge variant="success" dot>Assigned</Badge>
        </div>
        <div className="track">
          {['Booked','Assigned','En route','Detailing','Done'].map((s,i) => (
            <div key={s} className={`track__node ${i<=1?'done':''}`}>
              <span className="track__dot"/>
              <span className="track__label">{s}</span>
            </div>
          ))}
        </div>
      </Card>
      <div className="confirm__actions">
        <Button variant="secondary" leadingIcon={<Calendar width={16} height={16}/>}>Add to calendar</Button>
        <Button variant="ghost" onClick={onHome}>Back to home</Button>
      </div>
    </main>
  );
}

/* ── App ── */
function App() {
  const [screen,  setScreen]  = useState('home');
  const [pkg,     setPkg]     = useState('full');
  const [booking, setBooking] = useState(null);

  useEffect(() => { window.scrollTo({ top:0, behavior:'instant' }); }, [screen]);

  const goHome  = ()  => setScreen('home');
  const goBook  = ()  => setScreen('booking');
  const choose  = (id) => { setPkg(id); setScreen('booking'); };
  const confirm = (b)  => { setBooking(b); setScreen('confirm'); };

  return (
    <div>
      <SiteHeader onHome={goHome} onBook={goBook}/>
      {screen === 'home'    && <HomeScreen    onBook={goBook} onSelectPackage={choose}/>}
      {screen === 'booking' && <BookingScreen initialPackage={pkg} onConfirm={confirm} onHome={goHome}/>}
      {screen === 'confirm' && <ConfirmScreen booking={booking} onHome={goHome}/>}
      <SiteFooter/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
